<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 28px;
      color: #1a1a2e;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dde1e7;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 18px;
    }

    input:focus { border-color: #4f8ef7; }

    button {
      width: 100%;
      padding: 13px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }

    button:hover { background: #3a7de0; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .success {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      background: #edfbf3;
      border: 1.5px solid #5ecb8f;
      border-radius: 10px;
      color: #237a4b;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    .error-msg {
      display: none;
      margin-top: 12px;
      color: #d93025;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Оставить заявку</h1>

    <form id="form">
      <label for="name">Имя</label>
      <input id="name" type="text" placeholder="Иван Иванов" required />

      <label for="phone">Телефон</label>
      <input id="phone" type="tel" placeholder="+7 999 000 00 00" required />

      <button type="submit" id="btn">Отправить</button>
    </form>

    <div class="success" id="success">
      <div>✅ Заявка отправлена! Мы свяжемся с вами.</div>
      <button type="button" id="again-btn" onclick="resetForm()" style="margin-top:16px;background:#fff;color:#4f8ef7;border:1.5px solid #4f8ef7;">Отправить ещё раз</button>
    </div>
    <div class="error-msg" id="error">Что-то пошло не так. Попробуйте ещё раз.</div>
  </div>

  <script>
    function resetForm() {
      document.getElementById('form').reset();
      document.getElementById('form').style.display = 'block';
      document.getElementById('success').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      const btn = document.getElementById('btn');
      btn.disabled = false;
      btn.textContent = 'Отправить';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Отправляем…';

      const name  = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      try {
        const res = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone }),
        });
        const data = await res.json();

        if (data.ok) {
          document.getElementById('form').style.display = 'none';
          document.getElementById('success').style.display = 'block';
        } else {
          throw new Error(data.error);
        }
      } catch {
        document.getElementById('error').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Отправить';
      }
    });
  </script>
</body>
</html>
